name: Sovereign Build & Deploy
run-name: ⚡ Build — ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm ci || npm install

      - name: Build launcher & assets
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-build
          path: dist/
          retention-days: 7

      - name: Notify & ready for Xbox deploy
        run: echo "✅ Build complete — ready to deploy"
